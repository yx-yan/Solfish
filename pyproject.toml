[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "solfish"
version = "0.1.0"
description = "A general-purpose personal agent built from scratch on the Anthropic Messages API (DeepSeek by default)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Yuxuan Yan" }]
dependencies = ["anthropic>=2.1", "pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
solfish = "solfish.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/solfish"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
