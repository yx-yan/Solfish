<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solfish</title>
  <link rel="icon" href="/static/fish.svg">
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <aside id="sidebar">
    <header>
      <span class="brand">🐟 Solfish</span>
      <button id="new-chat" type="button">New chat</button>
    </header>
    <nav id="sessions" aria-label="Sessions"></nav>
    <section>
      <h2>Workspace</h2>
      <ul id="files"></ul>
    </section>
  </aside>

  <main>
    <div id="topbar">
      <button id="toggle-sidebar" type="button" aria-label="Show sessions">☰</button>
      <h1 id="title">New chat</h1>
      <span id="status"></span>
    </div>
    <div id="log" aria-live="polite"></div>
    <form id="composer">
      <textarea id="input" rows="1" placeholder="Message Solfish…" title="Enter to send, Shift+Enter for a new line"></textarea>
      <button id="send" type="submit">Send</button>
    </form>
  </main>
</body>
</html>
